
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Buttons</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons (Optional) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

<div class="container mt-5">
    <h2 class="mb-4">Bootstrap 5 Buttons Example</h2>

    <!-- Standard Buttons -->
    <h4>Standard Buttons</h4>
    <button class="btn btn-primary">Primary</button>
    <button class="btn btn-secondary">Secondary</button>
    <button class="btn btn-success">Success</button>
    <button class="btn btn-danger">Danger</button>
    <button class="btn btn-warning">Warning</button>
    <button class="btn btn-info">Info</button>
    <button class="btn btn-light">Light</button>
    <button class="btn btn-dark">Dark</button>
    <button class="btn btn-link">Link</button>

    <hr>

    <!-- Outline Buttons -->
    <h4>Outline Buttons</h4>
    <button class="btn btn-outline-primary">Primary</button>
    <button class="btn btn-outline-success">Success</button>
    <button class="btn btn-outline-danger">Danger</button>
    <button class="btn btn-outline-warning">Warning</button>

    <hr>

    <!-- Button Sizes -->
    <h4>Button Sizes</h4>
    <button class="btn btn-primary btn-lg">Large</button>
    <button class="btn btn-primary">Default</button>
    <button class="btn btn-primary btn-sm">Small</button>

    <hr>

    <!-- Disabled Button -->
    <h4>Disabled Button</h4>
    <button class="btn btn-primary" disabled>Disabled</button>

    <hr>

    <!-- Full Width Button -->
    <h4>Full Width Button</h4>
    <div class="d-grid gap-2">
        <button class="btn btn-success">Full Width Button</button>
    </div>

    <hr>

    <!-- Button Group -->
    <h4>Button Group</h4>
    <div class="btn-group" role="group">
        <button class="btn btn-primary">Left</button>
        <button class="btn btn-primary">Middle</button>
        <button class="btn btn-primary">Right</button>
    </div>

    <hr>

    <!-- Button with Icons -->
    <h4>Buttons with Icons</h4>
    <button class="btn btn-success">
        <i class="bi bi-check-circle-fill"></i> Save
    </button>

    <button class="btn btn-danger">
        <i class="bi bi-trash-fill"></i> Delete
    </button>

    <button class="btn btn-warning">
        <i class="bi bi-pencil-fill"></i> Edit
    </button>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
