<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Color-Coded Table</title>
<style>
    /* Table styling */
    table {
        border-collapse: collapse;
        width: 70%;
        margin: 20px auto;
        font-family: Arial, sans-serif;
    }
    th, td {
        border: 1px solid #555;
        padding: 10px;
        text-align: center;
    }
    th {
        background-color: #333;
        color: white;
    }
    /* Alternate row colors */
    tr:nth-child(even) {
        background-color: #f2f2f2;
    }
    /* Custom cell colors */
    .good {
        background-color: #c8e6c9; /* light green */
    }
    .average {
        background-color: #fff9c4; /* light yellow */
    }
    .poor {
        background-color: #ffcdd2; /* light red */
    }
</style>
</head>
<body>

<h2 style="text-align:center;">Performance Table</h2>

<table>
    <tr>
        <th>Name</th>
        <th>Math</th>
        <th>Science</th>
        <th>English</th>
    </tr>
    <tr>
        <td>Alice</td>
        <td class="good">95</td>
        <td class="average">75</td>
        <td class="poor">50</td>
    </tr>
    <tr>
        <td>Bob</td>
        <td class="average">70</td>
        <td class="good">90</td>
        <td class="average">78</td>
    </tr>
    <tr>
        <td>Charlie</td>
        <td class="poor">45</td>
        <td class="poor">55</td>
        <td class="good">88</td>
    </tr>
</table>

</body>
</html>
